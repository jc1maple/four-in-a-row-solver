<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>四子棋：必勝 AI 與教練</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1c2330; --muted: #5d6778; --line: #d9dde5;
    --board: #2456c9; --board-edge: #1b439e; --hole: #f4f5f7;
    --red: #e23d3d; --red-edge: #b82828; --yellow: #f5c518; --yellow-edge: #cc9f00;
    --accent: #2456c9; --on-accent: #ffffff;
    --good: #1a7f4b; --good-bg: #e4f4ea; --bad: #b3261e; --bad-bg: #fbe9e7; --mid: #6b5a00; --mid-bg: #f6efcf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b2029; --text: #e8ebf1; --muted: #9aa4b5; --line: #2c3340;
      --board: #1f4bb3; --board-edge: #163889; --hole: #12151b; --accent: #7da2ff; --on-accent: #10131a;
      --good: #6fd39a; --good-bg: #173324; --bad: #ff9a90; --bad-bg: #3a1b18; --mid: #e6d27a; --mid-bg: #332d12;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.6; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 14px 40px; }
  h1 { font-size: 1.35rem; margin: 0 0 10px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
  .modes button { font: inherit; font-size: .95rem; padding: 9px 6px; border: 0; background: var(--panel); color: var(--text); cursor: pointer; }
  .modes button + button { border-left: 1px solid var(--line); }
  .modes button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  #status {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 12px; min-height: 3.4em; display: flex; align-items: center; gap: 10px;
  }
  #status .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; }
  #status .dot.red { background: var(--red); } #status .dot.yellow { background: var(--yellow); }
  #status .dot.none { background: var(--line); }
  #statusText { font-size: .98rem; }
  #statusText small { display: block; color: var(--muted); font-size: .82rem; }
  #board {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 0;
    background: var(--board); border: 3px solid var(--board-edge); border-radius: 14px; padding: 6px;
    overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .col { display: flex; flex-direction: column-reverse; cursor: pointer; border-radius: 8px; padding: 0; border: 0; background: none; }
  .col:disabled { cursor: default; }
  @media (hover: hover) { .col:not(:disabled):hover { background: rgba(255,255,255,.14); } }
  .col:focus-visible { outline: 3px solid #fff; outline-offset: -3px; }
  .cell { aspect-ratio: 1; padding: 9%; }
  .hole { width: 100%; height: 100%; border-radius: 50%; background: var(--hole); position: relative; box-shadow: inset 0 2px 4px rgba(0,0,0,.35); }
  .disc { position: absolute; inset: 0; border-radius: 50%; animation: drop .32s cubic-bezier(.3,.0,.7,1); }
  .disc.red { background: var(--red); box-shadow: inset 0 0 0 4px var(--red-edge); }
  .disc.yellow { background: var(--yellow); box-shadow: inset 0 0 0 4px var(--yellow-edge); }
  .disc.win::after { content: ""; position: absolute; inset: 28%; border-radius: 50%; background: #fff; }
  .disc.last:not(.win)::after { content: ""; position: absolute; inset: 40%; border-radius: 50%; background: rgba(255,255,255,.75); }
  @keyframes drop { from { transform: translateY(calc(var(--fall) * -122%)); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .disc { animation: none; } }
  .colnums { display: grid; grid-template-columns: repeat(7, 1fr); padding: 5px 9px 0; color: var(--muted); font-size: .8rem; text-align: center; gap: 0; }
  .colnums span { margin: 0 3px; border-radius: 6px; padding: 1px 0; line-height: 1.35; }
  .colnums span b { display: block; font-weight: 600; font-size: .72rem; }
  .colnums span.h2 { background: var(--good-bg); color: var(--good); }
  .colnums span.h1 { background: var(--mid-bg); color: var(--mid); }
  .colnums span.h0 { background: var(--bad-bg); color: var(--bad); }
  .controls { display: flex; gap: 8px; margin: 12px 0 6px; flex-wrap: wrap; align-items: center; }
  button.act {
    font: inherit; font-size: .95rem; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); cursor: pointer;
  }
  button.act.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.act:disabled { opacity: .45; cursor: default; }
  label.hint { font-size: .9rem; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-left: auto; cursor: pointer; }
  label.hint input { width: 18px; height: 18px; }
  .record { color: var(--muted); font-size: .85rem; margin: 4px 0 12px; word-break: break-all; }
  #coach { margin-bottom: 12px; }
  .fb { border: 1px solid var(--line); border-left-width: 5px; border-radius: 10px; padding: 9px 13px; background: var(--panel); font-size: .95rem; }
  .fb.good { border-left-color: var(--good); } .fb.bad { border-left-color: var(--bad); } .fb.info { border-left-color: var(--line); }
  .fb strong.good { color: var(--good); } .fb strong.bad { color: var(--bad); }
  .review { margin: 10px 0 0; padding: 9px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: .9rem; }
  .review h2 { font-size: .95rem; margin: 0 0 4px; }
  .review ol { margin: 0; padding-left: 1.3em; }
  details { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-top: 10px; }
  summary { cursor: pointer; font-weight: 600; }
  details p, details li { font-size: .92rem; }
  details ol, details ul { padding-left: 1.3em; margin: 8px 0; }
  .spinner { width: 16px; height: 16px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
